[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centaurus"
version = "0.4.0-dev"
description = "Centaurus OSINT Framework"
requires-python = ">=3.12"

authors = [
{ name = "Marcos" }
]

dependencies = [
"python-whois==0.9.6",
"httpx>=0.27,<1",
"typer>=0.26.3,<0.28",
"rich>=15,<16",
"prompt-toolkit>=3.0.52,<4"
]

[project.scripts]
centaurus = "centaurus.main:main"

[tool.setuptools.packages.find]
where = ["src"]
