name: centaurus

services:

  centaurus-ollama:
    # G1: validated runtime is Ollama 0.31.2; the digest is immutable.
    image: ollama/ollama@sha256:509fdf54e23bd50d87af646cb51c0a7a203d6a83cc4d6695b3b08c5be1c62c0a
    container_name: centaurus-ollama
    restart: unless-stopped

    # R5: Ollama is an internal inference service. It has no published host
    # port and no default route to external networks.
    environment:
      OLLAMA_NO_CLOUD: "1"

    volumes:
      - ${CENTAURUS_OLLAMA_HOST_DIR:-/opt/osint-framework/runtime/ollama}:/root/.ollama:ro

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512

    networks:
      - centaurus-llm-network

  centaurus-core:
    # Built from the transient release bundle on the OVA.
    # The OVA does not keep a Git checkout or permanent source build context.
    image: centaurus-core:local
    container_name: centaurus-core

    environment:
      CENTAURUS_WORKSPACE: /workspace
      HOME: /tmp/centaurus
      CENTAURUS_LOG_LEVEL: "${CENTAURUS_LOG_LEVEL:-INFO}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://centaurus-ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-60}"
      OLLAMA_INTERPRETATION_TIMEOUT: "${OLLAMA_INTERPRETATION_TIMEOUT:-60}"
      CENTAURUS_WHOIS_TIMEOUT: "${CENTAURUS_WHOIS_TIMEOUT:-10}"
      CENTAURUS_RDAP_TIMEOUT: "${CENTAURUS_RDAP_TIMEOUT:-10}"
      CENTAURUS_CRTSH_TIMEOUT: "${CENTAURUS_CRTSH_TIMEOUT:-30}"
      CENTAURUS_DNSRECON_TIMEOUT: "${CENTAURUS_DNSRECON_TIMEOUT:-120}"
      CENTAURUS_SUBLIST3R_TIMEOUT: "${CENTAURUS_SUBLIST3R_TIMEOUT:-180}"
      CENTAURUS_THEHARVESTER_TIMEOUT: "${CENTAURUS_THEHARVESTER_TIMEOUT:-300}"

    volumes:
      - ${CENTAURUS_WORKSPACE_HOST_DIR:-/workspace}:/workspace

    depends_on:
      - centaurus-ollama

    # R5: the Core runs as the non-root user baked into the image. The image
    # filesystem is immutable at runtime; only /workspace and bounded /tmp are
    # writable. All Linux capabilities are dropped and privilege escalation is
    # disabled. init reaps child processes spawned by OSINT tools.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    init: true

    # The default container command is the conversational CLI.
    stdin_open: true
    tty: true

    # The Core is the only service with external egress. It reaches Ollama on
    # the isolated LLM network and OSINT sources through the egress network.
    networks:
      - centaurus-llm-network
      - centaurus-egress-network

    # The framework is invoked on demand. Keeping it behind a profile avoids
    # pretending that the current CLI is a long-running daemon service.
    profiles:
      - framework

networks:
  centaurus-llm-network:
    driver: bridge
    internal: true

  centaurus-egress-network:
    driver: bridge
