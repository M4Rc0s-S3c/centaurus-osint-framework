name: centaurus

services:

  centaurus-ollama:
    image: ollama/ollama:latest
    container_name: centaurus-ollama
    restart: unless-stopped

    # Ollama is reachable by the framework through the private Compose network.
    # Host publication is restricted to loopback for local administration only.
    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - /opt/osint-framework/runtime/ollama:/root/.ollama

    networks:
      - centaurus-network

  centaurus-core:
    # Built from the transient release bundle on the OVA.
    # The OVA does not keep a Git checkout or permanent source build context.
    image: centaurus-core:local
    container_name: centaurus-core

    environment:
      CENTAURUS_WORKSPACE: /workspace
      CENTAURUS_LOG_LEVEL: "${CENTAURUS_LOG_LEVEL:-INFO}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://centaurus-ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-60}"
      OLLAMA_INTERPRETATION_TIMEOUT: "${OLLAMA_INTERPRETATION_TIMEOUT:-60}"
      CENTAURUS_WHOIS_TIMEOUT: "${CENTAURUS_WHOIS_TIMEOUT:-10}"
      CENTAURUS_RDAP_TIMEOUT: "${CENTAURUS_RDAP_TIMEOUT:-10}"
      CENTAURUS_CRTSH_TIMEOUT: "${CENTAURUS_CRTSH_TIMEOUT:-30}"
      CENTAURUS_DNSRECON_TIMEOUT: "${CENTAURUS_DNSRECON_TIMEOUT:-120}"
      CENTAURUS_SUBLIST3R_TIMEOUT: "${CENTAURUS_SUBLIST3R_TIMEOUT:-180}"
      CENTAURUS_THEHARVESTER_TIMEOUT: "${CENTAURUS_THEHARVESTER_TIMEOUT:-300}"

    volumes:
      - /workspace:/workspace

    depends_on:
      - centaurus-ollama

    # The default container command is the conversational CLI.
    stdin_open: true
    tty: true

    networks:
      - centaurus-network

    # The framework is invoked on demand. Keeping it behind a profile avoids
    # pretending that the current CLI is a long-running daemon service.
    profiles:
      - framework

networks:
  centaurus-network:
    driver: bridge
